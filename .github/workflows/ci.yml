name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/training.txt
            requirements/serving.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/training.txt
          pip install -r requirements/serving.txt
          pip install -r requirements/dev.txt
          pip install tensorflow-cpu==2.15.1

      - name: Ensure processed dataset exists (CI fallback)
        run: |
          python scripts/ci_ensure_processed_data.py
          ls -lah data/processed

      - name: Bootstrap model artifacts for integration tests
        run: |
          python -m src.pipelines.prefect_flow --engine local --data-dir data --epochs 2 --batch-size 64 --no-mlflow

      - name: Run test suite
        run: |
          pytest -q

      - name: CLI smoke checks
        run: |
          python -m src.monitoring.drift_detection --reference data/processed/train_features_FD001.csv --current data/processed/train_features_FD001.csv
          python -m src.pipelines.retraining_pipeline --data-dir data --engine local --no-mlflow
