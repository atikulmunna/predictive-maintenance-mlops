name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/training.txt
            requirements/serving.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/training.txt
          pip install -r requirements/serving.txt
          pip install -r requirements/dev.txt
          pip install tensorflow-cpu==2.15.1

      - name: Create synthetic processed dataset (CI fallback)
        run: |
          if [ ! -f data/processed/train_features_FD001.csv ]; then
            python - <<'PY'
            from pathlib import Path
            import numpy as np
            import pandas as pd

            rng = np.random.default_rng(42)
            n_engines = 30
            cycles_per_engine = 50
            n_features = 45
            rows = []

            for unit_id in range(1, n_engines + 1):
                for cycle in range(1, cycles_per_engine + 1):
                    rul = cycles_per_engine - cycle
                    failure_soon = 1 if rul <= 10 else 0
                    signal = (1.0 / (rul + 1.0)) + float(rng.normal(0.0, 0.02))
                    row = {
                        "unit_id": unit_id,
                        "cycle": cycle,
                        "RUL": rul,
                        "failure_soon": failure_soon,
                        "f_signal": signal,
                        "f_cycle_norm": cycle / cycles_per_engine,
                    }
                    for i in range(1, n_features + 1):
                        trend = 0.0 if i % 3 else cycle * 0.005
                        row[f"f_{i:02d}"] = float(rng.normal(0.0, 1.0) + trend)
                    rows.append(row)

            out_path = Path("data/processed/train_features_FD001.csv")
            out_path.parent.mkdir(parents=True, exist_ok=True)
            pd.DataFrame(rows).to_csv(out_path, index=False)
            print(f"Created synthetic dataset: {out_path} rows={len(rows)}")
            PY
          fi

      - name: Bootstrap model artifacts for integration tests
        run: |
          python -m src.pipelines.prefect_flow --engine local --data-dir data --epochs 2 --batch-size 64 --no-mlflow

      - name: Run test suite
        run: |
          pytest -q

      - name: CLI smoke checks
        run: |
          python -m src.monitoring.drift_detection --reference data/processed/train_features_FD001.csv --current data/processed/train_features_FD001.csv
          python -m src.pipelines.retraining_pipeline --data-dir data --engine local --no-mlflow
